name: Audit Regression Checks

on:
  push:
    branches:
      - audit/critical-security-integrity-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  targeted-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application and test modules
        run: python -m compileall -q app scripts tests

      - name: Run security and data-integrity regressions
        run: python -m unittest discover -s tests -p "test_security_integrity_regressions.py" -v
