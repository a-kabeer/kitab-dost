<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="grad_sindhi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Book Base Background -->
  <rect width="300" height="420" rx="8" fill="url(#grad_sindhi)"/>

  <!-- Left Spine Shadow -->
  <rect width="22" height="420" rx="4" fill="url(#spine)"/>
  <line x1="22" y1="0" x2="22" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Top Educational Tag -->
  <rect x="36" y="32" width="130" height="24" rx="12" fill="rgba(255,255,255,0.18)"/>
  <text x="101" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">KITAAB BANK</text>

  <!-- Subject Category -->
  <text x="36" y="88" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SINDHI LANGUAGE</text>

  <!-- Subject Icon Graphic -->
  <circle cx="230" cy="80" r="32" fill="rgba(255,255,255,0.1)"/>
  <text x="230" y="90" font-size="30" text-anchor="middle">📜</text>

  <!-- Book Title -->
  <text x="36" y="160" fill="#ffffff" font-family="system-ui, 'Noto Nastaliq Urdu', sans-serif" font-size="22" font-weight="800">
    سنڌي ٻولي ۽ ادب
  </text>
  <text x="36" y="190" fill="#ffffff" font-family="system-ui, 'Noto Nastaliq Urdu', sans-serif" font-size="18" font-weight="700">
    
  </text>

  <!-- Decorative Divider -->
  <line x1="36" y1="215" x2="264" y2="215" stroke="#f472b6" stroke-width="2" opacity="0.6"/>

  <!-- Grade Badge -->
  <rect x="36" y="240" width="160" height="34" rx="6" fill="#ffffff"/>
  <text x="116" y="263" fill="#831843" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    درجو اٺون (Class 8)
  </text>

  <!-- Syllabus / Board Badge -->
  <text x="36" y="315" fill="rgba(255,255,255,0.85)" font-family="system-ui, 'Noto Nastaliq Urdu', sans-serif" font-size="12" font-weight="600">
    نصابي معيار:
  </text>
  <text x="36" y="335" fill="#ffffff" font-family="system-ui, 'Noto Nastaliq Urdu', sans-serif" font-size="13" font-weight="600">
    سنڌ ٽيڪسٽ بڪ بورڊ
  </text>

  <!-- Bottom Bar with Book Identifier -->
  <rect x="0" y="385" width="300" height="35" rx="0" fill="rgba(0,0,0,0.25)"/>
  <text x="36" y="407" fill="rgba(255,255,255,0.9)" font-family="system-ui, 'Noto Nastaliq Urdu', sans-serif" font-size="11" font-weight="700">ٻيهر استعمال جوڳو ڪتاب</text>
  <text x="264" y="407" fill="#f472b6" font-family="system-ui, 'Noto Nastaliq Urdu', sans-serif" font-size="11" font-weight="700" text-anchor="end">سرڪاري اسڪول</text>
</svg>