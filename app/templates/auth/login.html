{% extends "base.html" %}

{% block title %}Teacher Sign In - Kitaab Bank{% endblock %}

{% block content %}
<div class="container" style="max-width: 440px; margin: 2.5rem auto 4rem;">
  <div class="card" style="padding: 2.25rem 2rem;">
    <div class="text-center" style="margin-bottom: 2rem;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">👨‍🏫</div>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.25rem;">
        Teacher Sign In
      </h1>
      <p class="text-muted" style="font-size: 0.875rem;">
        Enter your school staff credentials to access the administrative desk.
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=next) }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <div class="mb-2">
        <label for="username" style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-primary);">
          Teacher Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          value="{{ username or '' }}"
          required
          autofocus
          autocomplete="username"
          placeholder="e.g. teacher"
          style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background-color: var(--bg-surface); color: var(--text-primary); font-size: 0.95rem; font-family: inherit;"
        >
      </div>

      <div class="mb-3">
        <label for="password" style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-primary);">
          Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="••••••••••••"
          style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background-color: var(--bg-surface); color: var(--text-primary); font-size: 0.95rem; font-family: inherit;"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        <span>Sign In to Teacher Desk</span>
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
      <span>Default School Staff Account: <strong>teacher</strong> / <strong>Teacher@123</strong></span>
    </div>
  </div>
</div>
{% endblock %}
